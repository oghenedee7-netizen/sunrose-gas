<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4b2a1f">
<title>SunRose Gas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0eb;color:#39231b;font-family:Arial,sans-serif}
header{background:#4b2a1f;color:#fff;padding:20px;text-align:center}header h1{margin:0;font:700 29px Georgia,serif}header p{margin:5px 0 0;color:#ead6b2}
.app{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 4px 18px #00000010}
h2{margin:0 0 15px}h3{margin:20px 0 10px}
input,select,button{font:inherit}input,select{width:100%;height:52px;border:1px solid #d9d0ca;border-radius:10px;padding:0 13px;background:#fff}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:#4b2a1f;color:#fff}.gold{background:#cda254;color:#24160f}.light{background:#eee7e1}.danger{background:#9f1f1f;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.total{display:flex;justify-content:space-between;font-size:24px;font-weight:800;border-top:1px solid #eee;padding-top:15px;margin-top:15px}.total b{font-size:31px}
.pay.selected{background:#cda254}.full{width:100%;margin-top:14px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.nav button{background:#fff;border:1px solid #ddd}.nav button.active{background:#4b2a1f;color:#fff}
.hidden{display:none!important}.muted{color:#776c65;font-size:13px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f7f2ee;border-radius:12px;padding:13px}.stat b{display:block;font-size:20px;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid #eee}th{background:#f7f2ee}.duplicate{font-weight:900;color:#a00000;background:#fff0f0}.badge{display:inline-block;padding:4px 7px;border-radius:6px;background:#eee}.dupbadge{background:#f5b2b2;color:#790000;font-weight:900}
.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;border-radius:10px;background:#fff5d9;margin:10px 0}
@media(max-width:650px){.grid,.statgrid{grid-template-columns:1fr 1fr}.triple{grid-template-columns:1fr}.tablewrap{overflow:auto}}
@media print{
 @page{size:80mm auto;margin:0}body{background:#fff}.no-print{display:none!important}.receipt{display:block!important;width:80mm;padding:8mm 5mm;font-family:Arial;color:#000}.receipt h1{text-align:center;font:700 21px Georgia,serif;margin:0}.receipt .line{border-top:1px dashed #000;margin-top:7px;padding-top:7px}.r{display:flex;justify-content:space-between;margin:5px 0;font-size:13px}.grand{font-size:18px;font-weight:900;border-top:1px dashed #000;padding-top:7px}.dup{font-weight:900;text-align:center;border:2px solid #000;padding:6px;margin:7px 0}.receipt{display:none}
}
</style>
</head>
<body>
<header class="no-print"><h1>SunRose Gas</h1><p>Staff Sales & Receipt System</p></header>
<div class="app no-print" id="app"></div>
<div class="receipt" id="receipt"></div>

<script>
const KEY="sunrose_gas_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 ownerPin:"1234", price:1400, staff:["Staff 1"], next:1, sales:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return "₦"+Number(n||0).toLocaleString("en-NG",{maximumFractionDigits:2})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function id(){return "SR-"+String(db.next++).padStart(4,"0")}
function date(t){return new Date(t).toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"})}
function renderLogin(){
 app.innerHTML=`<div class="card" style="max-width:480px;margin:30px auto"><h2>Sign in</h2>
 <label>Who are you?</label><select id="role"><option value="staff">Staff</option><option value="owner">Owner / Admin</option></select>
 <div id="staffBox" style="margin-top:12px"><label>Staff name</label><select id="staff">${db.staff.map(s=>`<option>${esc(s)}</option>`).join("")}</select></div>
 <div id="pinBox" class="hidden" style="margin-top:12px"><label>Owner PIN</label><input id="pin" type="password" inputmode="numeric"></div>
 <button class="primary full" onclick="login()">Continue</button>
 </div>`;
 role.onchange=()=>{staffBox.classList.toggle("hidden",role.value!=="staff");pinBox.classList.toggle("hidden",role.value!=="owner")}
}
function login(){
 if(role.value==="owner"){if(pin.value!==db.ownerPin){alert("Wrong Owner PIN.");return}window.ownerAuthenticated=true;renderOwner()}
 else { window.ownerAuthenticated=false; renderStaff(staff.value) }
}
function nav(active){
 return `<div class="nav"><button class="${active==="sale"?"active":""}" onclick="renderStaff(currentStaff)">New Sale</button><button class="${active==="records"?"active":""}" onclick="renderRecords()">Sales Records</button><button onclick="window.ownerAuthenticated=false;renderLogin()">Log out</button></div>`
}
let currentStaff="Staff 1";
function renderStaff(name){
 currentStaff=name; app.innerHTML=nav("sale")+`<div class="card"><h2>New Receipt</h2>
 <div class="notice"><b>Staff:</b> ${esc(name)}<br><span class="muted">Only Owner/Admin can change the price.</span></div>
 <div class="grid"><div><label>Kg</label><input id="kg" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Enter Kg" oninput="calc()"></div>
 <div><label>Price per Kg</label><input id="price" value="${db.price}" readonly></div></div>
 <div class="total"><span>Total</span><b id="total">₦0</b></div>
 <h3>Payment Method</h3><div class="triple"><button class="pay" onclick="pay(this,'Transfer')">Transfer</button><button class="pay" onclick="pay(this,'Cash')">Cash</button><button class="pay" onclick="pay(this,'POS')">POS</button></div>
 <button class="primary full" onclick="makeSale()">🖨 PRINT RECEIPT</button></div>`;
 window.selectedPay="";
}
function calc(){let q=Number(kg?.value)||0;total.textContent=money(q*db.price)}
function pay(el,p){document.querySelectorAll(".pay").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");selectedPay=p}
function makeSale(){
 let q=Number(kg.value)||0;if(q<=0){alert("Enter Kg.");return}if(!selectedPay){alert("Select Transfer, Cash or POS.");return}
 let sale={id:crypto.randomUUID(),receipt:id(),staff:currentStaff,kg:q,price:db.price,total:q*db.price,payment:selectedPay,time:Date.now(),duplicate:false,reprintOf:null};
 db.sales.unshift(sale);save();printSale(sale,false)
}
function printSale(s,dup){
 receipt.innerHTML=`<h1>SunRose Gas</h1><div style="text-align:center;font-size:11px">Clean Cooking Gas</div>
 ${dup?'<div class="dup">DUPLICATE / REPRINT</div>':''}<div class="line"><div class="r"><b>Receipt No:</b><b>${esc(s.receipt)}</b></div>
 <div class="r"><span>Date</span><span>${esc(date(s.time))}</span></div><div class="r"><span>Staff</span><span>${esc(s.staff)}</span></div></div>
 <div class="line"><div class="r"><span>Kg</span><b>${s.kg}</b></div><div class="r"><span>Price / Kg</span><span>${money(s.price)}</span></div>
 <div class="r grand"><span>TOTAL</span><b>${money(s.total)}</b></div><div class="r"><span>Payment</span><b>${esc(s.payment)}</b></div></div>
 <div style="text-align:center;font-size:11px;margin-top:12px">Thank you for your patronage</div>`;
 window.print();
}
function renderRecords(){
 let rows=db.sales.map(s=>`<tr class="${s.duplicate?"duplicate":""}"><td><b>${esc(s.receipt)}</b>${s.duplicate?'<br><span class="dupbadge">DUPLICATE / REPRINT</span>':""}</td><td>${esc(s.staff)}</td><td>${s.kg}</td><td>${money(s.total)}</td><td>${esc(s.payment)}</td><td>${date(s.time)}</td><td><button class="light" onclick="reprint('${s.id}')">Reprint</button></td></tr>`).join("");
 let totalSales=db.sales.filter(s=>!s.duplicate).reduce((a,s)=>a+s.total,0),kgSold=db.sales.filter(s=>!s.duplicate).reduce((a,s)=>a+s.kg,0);
 app.innerHTML=nav("records")+`<div class="card"><h2>Sales Records</h2><div class="statgrid"><div class="stat">Sales<b>${db.sales.filter(s=>!s.duplicate).length}</b></div><div class="stat">Kg Sold<b>${kgSold}</b></div><div class="stat">Sales Value<b>${money(totalSales)}</b></div><div class="stat">Duplicates<b>${db.sales.filter(s=>s.duplicate).length}</b></div></div>
 <div class="notice">🔴 <b>Duplicate / Reprint receipts are deliberately shown boldly.</b></div>
 <div class="tablewrap" style="margin-top:15px"><table><thead><tr><th>Receipt</th><th>Staff</th><th>Kg</th><th>Total</th><th>Payment</th><th>Date</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7">No sales yet.</td></tr>'}</tbody></table></div></div>`
}
function reprint(sid){let s=db.sales.find(x=>x.id===sid);if(!s)return;if(!confirm("Reprint this receipt? It will be marked DUPLICATE / REPRINT."))return;let r={...s,id:crypto.randomUUID(),receipt:id(),time:Date.now(),duplicate:true,reprintOf:s.receipt};db.sales.unshift(r);save();printSale(r,true);renderRecords()}
function renderOwner(){
  // Owner/Admin controls are only available after successful Owner PIN login.
  if (!window.ownerAuthenticated) { renderLogin(); return; }
 app.innerHTML=nav("admin")+`<div class="card"><h2>Owner / Admin</h2><div class="notice">🔐 Only you should use this section. Staff cannot access the price controls without the Owner PIN.</div>
 <div class="grid"><div><label>Current price per Kg</label><input id="newPrice" type="number" value="${db.price}"></div><div><label>New Owner PIN</label><input id="newPin" type="password" placeholder="Leave blank to keep current"></div></div>
 <button class="gold full" onclick="saveAdmin()">Save Owner Settings</button></div>
 <div class="card"><h2>Staff</h2><div class="grid"><input id="newStaff" placeholder="Staff name"><button class="light" onclick="addStaff()">Add Staff</button></div><p>${db.staff.map(s=>`<span class="badge">${esc(s)}</span>`).join(" ")}</p></div>
 <div class="card"><h2>Quick Summary</h2><div class="statgrid"><div class="stat">Sales<b>${db.sales.filter(s=>!s.duplicate).length}</b></div><div class="stat">Kg<b>${db.sales.filter(s=>!s.duplicate).reduce((a,s)=>a+s.kg,0)}</b></div><div class="stat">Value<b>${money(db.sales.filter(s=>!s.duplicate).reduce((a,s)=>a+s.total,0))}</b></div><div class="stat">Duplicates<b>${db.sales.filter(s=>s.duplicate).length}</b></div></div><button class="primary full" onclick="renderRecords()">View All Sales</button></div>`
}
function saveAdmin(){let p=Number(newPrice.value);if(!p||p<=0){alert("Enter a valid price.");return}db.price=p;if(newPin.value.trim())db.ownerPin=newPin.value.trim();save();alert("Owner settings saved.");renderOwner()}
function addStaff(){let n=newStaff.value.trim();if(!n)return;if(!db.staff.includes(n))db.staff.push(n);save();renderOwner()}
renderLogin();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
